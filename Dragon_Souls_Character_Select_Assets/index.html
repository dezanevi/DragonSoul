<!doctype html><html lang="cs"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dragon Souls – Nová hra</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at center,#24465b,#0a1424);color:#ffe7ae;font-family:Georgia,serif}.panel{width:min(95vw,850px);padding:25px 30px;background:linear-gradient(#172b43,#0b1627);border:4px ridge #bd914c;border-radius:18px;box-shadow:0 15px 60px #000b;text-align:center}h1{font-size:32px;margin:0 0 12px}.name{display:block;margin:12px auto 18px;width:min(90%,400px);font:24px Georgia;padding:12px;color:#f9e6b8;background:#07182c;border:2px solid #b98d4b;border-radius:8px}.choices{display:flex;justify-content:center;gap:35px}.choice{background:none;border:0;cursor:pointer;padding:0;width:42%;max-width:320px}.choice img{display:block;width:100%;object-fit:contain}.choice .avatar{height:245px}.choice .gender{height:105px;object-fit:contain}.confirm{display:block;background:none;border:0;margin:10px auto 0;cursor:pointer;width:min(85%,440px);padding:0}.confirm img{width:100%}.choice:focus-visible,.confirm:focus-visible{outline:3px solid #ffe38e}#status{min-height:24px;margin:12px 0 0;color:#dceaff}
</style><main class="panel"><h1>Vytvoření postavy</h1><label for="name">Jméno</label><input id="name" class="name" maxlength="24" autocomplete="off" placeholder="Zadej jméno"><div class="choices"><button class="choice" id="male" aria-label="Muž" aria-pressed="true"><img class="avatar" alt="Mužský avatar"><img class="gender" alt="Symbol muže"></button><button class="choice" id="female" aria-label="Žena" aria-pressed="false"><img class="avatar" alt="Ženský avatar"><img class="gender" alt="Symbol ženy"></button></div><button class="confirm" id="confirm" aria-label="Potvrdit"><img src="sprites/confirm_normal.png" alt="Potvrdit"></button><p id="status" role="status"></p></main><script>
let gender='male';const $=id=>document.getElementById(id);function render(){for(const g of ['male','female']){const active=g===gender;$(g).querySelector('.avatar').src=`sprites/${g}_${active?'selected':'inactive'}.png`;$(g).querySelector('.gender').src=`sprites/${g}_button_${active?'active':'inactive'}.png`;$(g).setAttribute('aria-pressed',String(active));}}for(const g of ['male','female'])$(g).addEventListener('click',()=>{gender=g;render()});const confirm=$('confirm');confirm.addEventListener('mouseenter',()=>confirm.querySelector('img').src='sprites/confirm_hover.png');confirm.addEventListener('mouseleave',()=>confirm.querySelector('img').src='sprites/confirm_normal.png');confirm.addEventListener('focus',()=>confirm.querySelector('img').src='sprites/confirm_hover.png');confirm.addEventListener('blur',()=>confirm.querySelector('img').src='sprites/confirm_normal.png');confirm.addEventListener('click',()=>{const name=$('name').value.trim();if(!name){$('status').textContent='Nejdříve zadej jméno.';return}$('status').textContent=`Postava ${name} (${gender==='male'?'muž':'žena'}) je připravena.`;window.dispatchEvent(new CustomEvent('dragonSouls:newGame',{detail:{name,gender}}));});render();
</script></html>
