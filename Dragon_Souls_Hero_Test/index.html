<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dragon Souls – Karta hrdiny</title><style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#f5e8b5;font:16px Georgia,serif;min-height:100vh;display:grid;place-items:center}.shell{width:min(100vw,1536px);padding:12px}.hint{text-align:center;font:14px system-ui;margin:8px;color:#cbd5e1}.stage{position:relative;width:100%;aspect-ratio:1536/1024;background:url('assets/hero_card.png') center/100% 100% no-repeat;box-shadow:0 10px 50px #0009}.stage.hidden{display:none}.hot{position:absolute;border:0;background:transparent;cursor:pointer;border-radius:10px;color:transparent;outline-offset:-3px}.hot:hover{box-shadow:inset 0 0 0 2px #ffdf74,0 0 15px 4px #ffc436b0;background:#ffce3917}.hot:focus-visible{outline:3px solid #fff}.hot.active{box-shadow:inset 0 0 0 3px #43ccff,0 0 14px 3px #08aaff;background:#078bff22}.hot.disabled{filter:grayscale(1);cursor:not-allowed}.hot:active{transform:scale(.98)}.hot.close:hover{background:#ffca3525}.toolbar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.toolbar button{font:16px Georgia;background:#082747;color:#fff0c6;border:2px solid #d69c31;padding:10px 20px;border-radius:8px;cursor:pointer}.toolbar button:hover{background:#165c93}.toast{min-height:24px;text-align:center;color:#f2ce80;font:14px system-ui}.legend{text-align:center;color:#aebaca;font:12px system-ui;margin-top:8px}.stage::after{content:'';position:absolute;inset:0;pointer-events:none}.closed{display:none;text-align:center;padding:12vh 0}.closed h1{color:#ffda75}.closed button{padding:12px 24px;font:18px Georgia;background:#073d6c;border:2px solid gold;color:white;cursor:pointer}
</style></head><body><div class="shell"><div class="toolbar"><button id="toggle">Zavřít kartu (C)</button><button id="reset">Obnovit výběr</button></div><p class="hint">C = otevřít / zavřít · ESC = zavřít · kliknutím vyzkoušíš schválené interaktivní oblasti</p><div class="stage" id="stage" role="region" aria-label="Karta hrdiny"></div><div class="closed" id="closed"><h1>Karta hrdiny je zavřená</h1><button id="open">Otevřít kartu (C)</button></div><p class="toast" id="toast" aria-live="polite"></p><p class="legend">Grafický podklad je schválená karta; aktivní plochy jsou samostatná klikací vrstva. Testovací verze neobsahuje herní data.</p></div><script>
const stage=document.getElementById('stage'),closed=document.getElementById('closed'),toast=document.getElementById('toast');let opened=true;const rect=(x,y,w,h)=>({x,y,w,h});
function add(name,r,kind,active=false){let b=document.createElement('button');b.className='hot '+kind+(active?' active':'');b.setAttribute('aria-label',name);b.title=name;Object.assign(b.style,{left:r.x/1536*100+'%',top:r.y/1024*100+'%',width:r.w/1536*100+'%',height:r.h/1024*100+'%'});b.addEventListener('click',()=>{if(kind==='close'){setOpen(false);return}if(kind==='tab'){document.querySelectorAll('.hot.tab').forEach(e=>e.classList.remove('active'));b.classList.add('active')}else b.classList.toggle('active');toast.textContent=name+' – '+(b.classList.contains('active')?'aktivní':'základní')});stage.appendChild(b)}
const tabs=['Hrdina','Talenty','Party','Inventář','Řemesla','Bestiář','Mapa','Úkoly'];const bounds=[36,278,468,653,838,1020,1192,1350,1525];tabs.forEach((n,i)=>add(n,rect(bounds[i],17,bounds[i+1]-bounds[i]-4,65),'tab',i===0));
const equip=[['Meč',360,413],['Štít',360,480],['Prsten',360,548],['Amulet',360,615],['Helma',690,413],['Zbroj',690,480],['Nohy',690,548],['Boty',690,615]];equip.forEach(([n,x,y])=>add(n,rect(x,y,91,62),'equip'));
const skills=['Sběr bylin','Alchymie','Těžba','Rybolov','Vaření','Kovářství','Řemeslnictví','Diplomacie'];skills.forEach((n,i)=>add(n,rect(91+(i%4)*191,736+Math.floor(i/4)*82,182,73),'skill'));
add('Zavřít',rect(628,914,275,78),'close');
function setOpen(v){opened=v;stage.classList.toggle('hidden',!v);closed.style.display=v?'none':'block';document.getElementById('toggle').textContent=v?'Zavřít kartu (C)':'Otevřít kartu (C)';toast.textContent=v?'Karta hrdiny otevřena':'Karta hrdiny zavřena'}document.getElementById('toggle').onclick=()=>setOpen(!opened);document.getElementById('open').onclick=()=>setOpen(true);document.getElementById('reset').onclick=()=>{document.querySelectorAll('.hot').forEach(e=>e.classList.remove('active'));document.querySelector('.hot.tab').classList.add('active');toast.textContent='Výběr obnoven'};document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='c'&&!e.ctrlKey&&!e.altKey){setOpen(!opened)}if(e.key==='Escape'&&opened)setOpen(false)});
</script></body></html>
