<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dragon Souls – Odkaz dračích jezdců</title>

    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #10151a;
        color: #f5e7bd;
        font-family: system-ui, sans-serif;
      }

      body {
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      #game {
        width: min(100vw, 1920px, calc(100vh * 16 / 9));
        aspect-ratio: 16 / 9;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
        border: 2px solid #8d744b;
      }
    </style>
  </head>

  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
